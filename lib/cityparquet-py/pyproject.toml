[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "cityparquet"
description = "Python bindings for CityParquet: convert, export and validate packages"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.maturin]
module-name = "cityparquet"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]
